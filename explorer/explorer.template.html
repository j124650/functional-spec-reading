  }

  function drawLabels(){
    gLabels.innerHTML="";
    labelSpecs.forEach(sp=>{
      const other = selTransition
        ? (sp.e.id!==selTransition)
        : (selState ? !(sp.e.from===selState || sp.e.to===selState) : false);
      const tx=mk("text",{class:"elabel"+(sp.e.id===selTransition?" sel":(other?" dim":"")),
        x:sp.dx,y:sp.dy,"text-anchor":"middle"});
      tx.textContent=sp.txt;
      tx.style.cursor="pointer";
      tx.addEventListener("click",()=>{ selTransition=sp.e.t.id; drawMachine(); showTransition(sp.e.t.id); });
      gLabels.appendChild(tx);
      const path=paths[sp.e.id], PL=path.getTotalLength();
      let best=null, bd=1e9;
      for(let k=0;k<=40;k++){
        const pt=path.getPointAtLength(PL*k/40);
        const d=Math.hypot(pt.x-sp.dx,pt.y-sp.dy);
        if(d<bd){bd=d;best=pt;}
      }
      if(best && bd>=12){
        gLead.appendChild(mk("line",{class:"leader",x1:sp.dx,y1:sp.dy,x2:best.x,y2:best.y}));
      }
    });
  }

  /* ---- fit the canvas to what was actually drawn ----
     The viewBox is taken from the rendered bounding box, so nothing can
     be drawn outside the canvas however the labels were moved.

     The diagram is SCALED TO FIT the panel rather than drawn at natural
     size and scrolled. A reader who has to scroll a diagram to find a
     state is reading a diagram badly; the whole machine should be visible
     at once.

     The text is sized in SCREEN pixels: the scale the browser applies is
     worked out, and the font sizes are divided by it, so the labels stay
     the same size on screen whatever the diagram's width. Without this, a
     wide machine's labels shrink to nothing.

     The extent is measured from the GEOMETRY, not from the rendered text.
     A text element's box grows as its font grows, so measuring the
     extent with the text in it and then growing the text inflates the
     drawing without bound. The boxes and the edges are what the extent
     has to cover; the labels sit on the edges. */
  function fitCanvas(){
    /* The extent is measured from the GEOMETRY — the boxes and the edges —
       not from the rendered text. A text element's box grows as its font
       grows, so measuring the extent with the text in it and then growing
       the text inflates the drawing without bound. The labels sit on the
       edges, so the edges' extent covers them. */
    let bb=null;
    try{
      const boxBB=gNodes.getBBox();
      const edgeBB=gEdges.getBBox();
      const x=Math.min(boxBB.x,edgeBB.x), y=Math.min(boxBB.y,edgeBB.y);
      const w=Math.max(boxBB.x+boxBB.width,edgeBB.x+edgeBB.width)-x;
      const h=Math.max(boxBB.y+boxBB.height,edgeBB.y+edgeBB.height)-y;
      bb={x:x,y:y,width:w,height:h};
    }catch(err){}
    if(!bb || bb.width<=0){
      svg.setAttribute("viewBox","0 0 "+(gridRight+GUT)+" "+(bandY+90));
      svg.setAttribute("preserveAspectRatio","xMidYMid meet");
      svg.style.width="100%"; svg.style.height="100%";
      return 1;
    }
    const pad=18;
    const vw=bb.width+2*pad, vh=bb.height+2*pad;
    svg.setAttribute("viewBox",(bb.x-pad)+" "+(bb.y-pad)+" "+vw+" "+vh);
    svg.setAttribute("preserveAspectRatio","xMidYMid meet");
    svg.style.width="100%"; svg.style.height="100%";
    /* The scale the browser will apply: the drawing is fitted to the
       panel, whichever of width and height binds first. */
    const r=svg.getBoundingClientRect();
    const scale = (r.width&&r.height) ? Math.min(r.width/vw, r.height/vh) : 1;
    const setFont=(sel,px)=>{
      svg.querySelectorAll(sel).forEach(t=>{ t.style.fontSize=(px/scale)+"px"; });
    };
    setFont("text.sname",12);
    setFont("text.sid",10);
    setFont("text.elabel",11);
    return scale;
  }

  let scale=1;
  for(let round=0; round<4; round++){
    scale=fitCanvas();
    placeLabels(scale);
    drawLabels();
  }
  /* The last round placed the labels against a scale that the labels
     themselves may have changed, so the canvas is fitted once more. */
  scale=fitCanvas();

  const reach = (D.byState||[]).filter(b=>b.machine===curMachine);
  /* Only the markers that stand for a destination the document does not
     name are counted here. The start marker is a position in the flow, not a
     destination, and counting it would report a destination that is not
     missing. */
  const unstatedCount = synthList.filter(s=>s.kind==="unstated").length;
  showMachine(reach, unstatedCount);
}

/* The machine overview: what the machine is, and what the reader can
   reach from it. */
function showMachine(reach, unstatedCount){
  const m=machineById(curMachine); if(!m) return;
  reach = reach || (D.byState||[]).filter(b=>b.machine===curMachine);
  unstatedCount = (unstatedCount===undefined)
    ? (D.transitions||[]).filter(t=>t.machine===curMachine && !(t.toStates||[]).length).length
    : unstatedCount;
  const cls=classificationOf(curMachine);
  $("#machDetail").innerHTML =
    "<h3>"+esc(m.name)+"</h3>"+
    "<div class='muted small' style='margin-bottom:8px'>"+esc(m.id)+"</div>"+
    /* How this machine came to be, said plainly and apart from the
       reason: the reader's first question about a diagram is whether the
       document states it or the analysis assembled it. */
    "<div class='clsline'>"+
      "<span class='clslabel'>This machine is</span>"+
      "<span class='pill "+cls.tone+"'>"+esc(cls.kind||"unclassified")+"</span>"+
      "<span class='muted small'>"+esc(cls.hint)+"</span>"+
    "</div>"+
    "<dl>"+
    "<dt>Concept</dt><dd>"+q(m.concept||"")+"</dd>"+
    "<dt>Dimensions</dt><dd>"+q(m.dimensions||"")+"</dd>"+
    "<dt>Why</dt><dd class='prose'>"+q(m.classificationReason||"—")+"</dd>"+
    "<dt>Initial</dt><dd>"+q(m.initialState||"")+"</dd>"+
    "<dt>Terminal</dt><dd>"+q(m.terminalStates||"")+"</dd>"+
    "<dt>Confidence</dt><dd>"+q(m.confidence||"")+"</dd>"+
    "<dt>Reachable</dt><dd>"+reach.map(r=>esc(r.state)+" ("+num(r.total)+")").join(", ")+"</dd>"+
    (unstatedCount?"<dt>Unstated</dt><dd>"+unstatedCount+" destination(s) the document does not name</dd>":"")+
    "</dl>"+
    "<p class='muted small' style='margin-top:9px'>Click a node or an edge for its detail. "+
    "Red dashed = a confirmed defect; amber = a spec gap; ? = a destination the document "+
    "does not name.</p>";
}

/* The trigger's NAME is the export's: the exporter reads the trigger once
   and ships both the words and the name, so the page strips nothing. */
function showState(id){
  const s=stateById(id); if(!s) return;
  /* The incoming and outgoing lists come from the export's hierarchy: the
     engine knows which transitions leave and enter each state, including
     the ones whose From cell names several states. */
  const hier=(D.hierarchy||[]).find(h=>h.machine===curMachine);
  const hs=((hier&&hier.states)||[]).find(x=>x.id===id)||{outgoing:[],incoming:[]};
  const incoming=(hs.incoming||[]).map(tid=>byId(TRANSITIONS,tid)).filter(Boolean);
  const outgoing=(hs.outgoing||[]).map(tid=>byId(TRANSITIONS,tid)).filter(Boolean);
  const list = stateTab==="incoming" ? incoming : outgoing;
  /* The invariants this state holds, as the export resolved them. */
  const invIds = s.invariantIds || [];
  /* The id is the HANDLE and the trigger is the NAME, so the trigger is
     what the reader recognises and the trigger is what is clickable. The
     id goes in the hint. The guard is READ, not shown as an expression:
     the reading is what the reader can act on, and the source expression
     stays in the cell's hint and in the export behind it. */
  /* The trigger names its command by code and by name - "CMD-001 Create
     application". The code is a handle, so it goes in the hint and the
     cell shows the name the reader recognises. */
  const rows = list.map(t=>{
    const words = t.guardNotExpressible ? null : decypher(t.guardExpression);
    return [
      '<span class="handle">'+esc(t.id)+"</span>",
      chip(t.id,"TR",{tr:true}),
      esc(t.actor||""),
      words
        ? '<span class="written" title="'+esc(t.guardExpression||"")+'">'+words+"</span>"
        : '<span class="mono">'+esc(t.guardExpression||"")+"</span>"
    ];
  });

/* ============================================ TAB: the specification itself
   The document the analysis was read from, cut into paragraphs by the
   exporter. The reader navigates it by paragraph: the outline names the
   sections, the body shows every paragraph, and the references the
   document makes to itself are drawn as chips - so a link is a link to
   a paragraph that exists, and the page never looks for a reference in
   a sentence. */
const SPEC = D.spec||[];
const SPEC_BY_ID = {};
SPEC.forEach(p=>{SPEC_BY_ID[p.id]=p;});
/* The SOURCE specification: the document the analysis was read from, as
   a TREE of sections. The evidence cites its sections, and a section is
   addressed by the source id and its number path - SRC-001/6.3. The
   tree is the document's structure, not a list's order: a reader walks
   to the section it names. */
const SOURCE_SPEC = D.sourceSpec||null;

/* An evidence cell: the document's own words, and the sections it
   cites. The exporter cut it, so the page never has to recognise a
   section number in a sentence - and a chip is a link to a section
   that exists. */
function citationCell(parts){
  if(!Array.isArray(parts)) return cell(parts||"");
  if(!parts.length) return "";
  return parts.map(p=>{
    if(!p.id) return linkify(q(String(p.text||"")));
    /* Every citation is grounded in the source specification, and the
       chip says the section it names. */
    return specChip(p.id,p.label||p.id);
  }).join("");
}
/* A section of the source specification, as a chip: the section's own
   mark, and the words the citation was written with. */
function specChip(id,label){
  return '<a class="idlink chip chip--definitions" href="#'+esc(id)+
         '" data-spec="'+esc(id)+'" title="'+esc(id+" — "+label)+'">'+
         '<span class="chip__icon">¶</span>'+
         '<span class="idname chip__name">'+esc(label)+"</span></a>";
}
/* One paragraph, drawn: its words, and the references it makes. */
function specParts(p){
  /* A table is drawn AS a table. The rows were cut by the exporter,
     so the page draws cells and never splits a row itself. */
  if(p.kind==="table"&&p.rows&&p.rows.length){
    let h="<table><thead><tr>";
    (p.rows[0]||[]).forEach(c=>{ h+="<th>"+q(c)+"</th>"; });
    h+="</tr></thead><tbody>";
    p.rows.slice(1).forEach(row=>{
      h+="<tr>";
      row.forEach(c=>{ h+="<td>"+q(c)+"</td>"; });
      h+="</tr>";
    });
    return h+"</tbody></table>";
  }
  let html="";
  (p.parts||[]).forEach(part=>{
    if(part.reference){
      /* A reference the document makes to another of its sections. */
      html+=specChip(part.reference,part.label||part.reference);
      return;
    }
    const t=String(part.text||"");
    html+=(p.kind==="code")
      ? '<span class="specpre">'+esc(t)+"</span>"
      : q(t);
  });
  return html;
}
function renderSpec(){
  const outline=$("#specOutline"), body=$("#specBody");
  if(!outline||!body) return;
  if(!SOURCE_SPEC){ outline.innerHTML=""; body.innerHTML=""; return; }
  /* The outline: the sections, nested as the document nests them. */
  let o="";
  const walkOutline=(node,depth)=>{
    (node.sections||[]).forEach(s=>{
      o+='<div class="specitem" data-spec="'+esc(s.id)+'" style="padding-left:'+
         (6+depth*12)+'px"><span class="specnum">'+esc(s.number||"")+
         '</span>'+esc(s.title)+"</div>";
      walkOutline(s,depth+1);
    });
  };
  walkOutline(SOURCE_SPEC,0);
  outline.innerHTML=o;
  /* The document: every section, with its own content and its
     subsections under it. */
  let b="";
  const walkBody=(node,depth)=>{
    if(depth>0){
      b+='<div class="specp spechead" id="'+esc(node.id)+'"><h3>'+
         (node.number?esc(node.number)+" · ":"")+esc(node.title)+"</h3></div>";
    }
    (node.paragraphs||[]).forEach(p=>{
      const inner=specParts(p);
      b+='<div class="specp" id="'+esc(p.id)+'">'+inner+"</div>";
    });
    (node.sections||[]).forEach(s=>walkBody(s,depth+1));
  };
  walkBody(SOURCE_SPEC,0);
  body.innerHTML=b;
  /* The outline goes to a section BY ITS ID - never by where it
     happens to sit on the page. */
  outline.querySelectorAll("[data-spec]").forEach(a=>{
    a.onclick=(ev)=>{ ev.preventDefault(); gotoSpec(a.dataset.spec); };
  });
}
function gotoSpec(id){
  /* A citation chip may sit in another tab, and the specification is
     drawn when it is first shown - so the reader goes to the
     specification FIRST, and the paragraph is looked up after it is
     there. */
  const tab=document.querySelector("main>section#t-spec");
  if(tab&&!tab.classList.contains("on")) showTab("spec");
  const target=document.getElementById(id);
  if(target) target.scrollIntoView({block:"start"});
}
/* =========================================================== TAB 8: glossary
   The ubiquitous language: every term the document defines, what it means,
   where it came from, and whether the document settles it. */
const GLOSSARY = D.glossary||[];
const glTB=$("#glossaryToolbar");
let glStatus="all", glSearch="";
/* The status column carries the document's own wording, which varies.
   The filter is derived from the data: the distinct leading states it
   takes, not a list written from memory. */
function glStatusKind(s){
  const t=String(s||"").replace(/\*/g,"").trim();
  if(/^Undefined/i.test(t)) return "Undefined";
  if(/^Pending/i.test(t)) return "Pending";
  if(/Defined \(partial\)/i.test(t)) return "Partly defined";
  if(/Overloaded/i.test(t)) return "Overloaded";
  if(/^Defined/i.test(t)) return "Defined";
  return "Other";
}
const GL_KINDS=["Defined","Partly defined","Overloaded","Undefined","Pending","Other"];
/* The status cell of the document is a sentence: the status, and then
   sometimes a note about it. "Defined (partial) — start point Conflicting,
   see F-03". The status and the note are separate things, so they are
   read apart: the status in the chip, the note after it, with the ids in
   the note turned into links like everywhere else.
   The chip carries the document's own word for the status, so the cell
   says what the document says and says it once. */
function splitStatus(s){
  const raw=String(s==null?"":s);
  const i=raw.indexOf("—");
  if(i<0) return {word:raw.trim(), note:""};
  return {word:raw.slice(0,i).trim(), note:raw.slice(i+1).trim()};
}
function glPillClass(kind){
  return kind==="Defined" ? "ok"
       : kind==="Partly defined" ? "info"
       : kind==="Undefined" ? "def"
       : kind==="Pending" ? "gap" : "mute";
}
const glKindGrp=el("div","grp");
glKindGrp.appendChild(el("span","glabel","Status"));
[["all","All"]].concat(GL_KINDS.map(k=>[k,k])).forEach(([v,l])=>{
  if(v!=="all"){
    const n=GLOSSARY.filter(g=>glStatusKind(g.status)===v).length;
    if(!n) return;
  }
  const e=el("label","chip"); const i=document.createElement("input");
  i.type="radio"; i.name="glk"; i.value=v; if(v==="all") i.checked=true;
  i.onchange=()=>{ glStatus=v; renderGlossary(); };
  e.appendChild(i);
  e.appendChild(el("span","", v==="all" ? "All" : l+" ("+GLOSSARY.filter(g=>glStatusKind(g.status)===v).length+")"));
  glKindGrp.appendChild(e);
});
glTB.appendChild(glKindGrp);
{
  const l=el("label",""); l.appendChild(el("span","","search"));
  const i=document.createElement("input"); i.type="search";
  i.placeholder="term, definition…";
  i.oninput=()=>{ glSearch=i.value.toLowerCase(); renderGlossary(); };
  l.appendChild(i); glTB.appendChild(l);
}
function renderGlossary(){
  const qy=glSearch;
  const rows=GLOSSARY.filter(g=>{
    if(glStatus!=="all" && glStatusKind(g.status)!==glStatus) return false;
    if(qy && !(g.term+" "+g.definition+" "+g.context).toLowerCase().includes(qy)) return false;
    return true;
  });
  DataTable($("#glossaryTable"),{
    id: "tGlos",
    columns: [
      {k:"term",label:"Term",w:"12%"},{k:"definition",label:"Definition",w:"24%"},
      {k:"status",label:"Status",w:"20%"},{k:"context",label:"Context",w:"15%"},
      {k:"id",label:"ID",cls:"id",w:"6%"},{k:"evidence",label:"Evidence",w:"23%"}],
    rows: rows.map(g=>{
      const kind=glStatusKind(g.status);
      const st=splitStatus(g.status);
      return [
      '<b>'+esc(g.term)+"</b>",
      cell(g.definition||""),
      '<span class="pill '+glPillClass(kind)+'" title="'+esc(plain(g.status))+'">'+
          esc(plain(st.word))+"</span>"+
        (st.note ? ' <span class="muted small">'+cell(st.note)+"</span>" : ""),
      cell(g.context||""),
      esc(g.id||""),
      citationCell(g.evidence)];})});
}

/* ========================================================== TAB 9: catalogue
   The definitions the document issues: the sources it was read from, the
   entities, value objects, aggregates, bounded contexts, commands, events,
   policies, scenarios and role-rewritten rules. Every id in the page
   points here. */
const CATALOGUE = D.catalogue||[];
const CAT_AGG = D.catalogueAggregates||[];
const CAT_SCN = D.catalogueScenarios||[];
const CAT_N = D.catalogueNamedRules||[];
/* The catalogue is FLAT: one record per identifier, each carrying the
   series it belongs to. The series the reader can filter by come from the
   export's namespace — the format's list, with the counts the document
   happens to hold. */
const CAT_SERIES = D.idSeries||[];
const catTB=$("#catToolbar");
let catSeries="", catSearch="";
{
  const grp=el("div","grp");
  grp.appendChild(el("span","glabel","Series"));
  const all=el("label","chip"); const ai=document.createElement("input");
  ai.type="radio"; ai.name="catk"; ai.value=""; ai.checked=true;
  ai.onchange=()=>{ catSeries=""; renderCat(); };
  all.appendChild(ai);
  /* The name of the series. Not the id code, and not the count: the
     reader is choosing a filter, and the records themselves carry both. */
  all.appendChild(el("span","","All"));
  grp.appendChild(all);
  CAT_SERIES.forEach(s=>{
    const e=el("label","chip"); const i=document.createElement("input");
    i.type="radio"; i.name="catk"; i.value=s.prefix;
    i.onchange=()=>{ catSeries=s.prefix; renderCat(); };
    e.appendChild(i);
    e.appendChild(el("span","",s.kind));
    grp.appendChild(e);
  });
  catTB.appendChild(grp);
}
{
  const l=el("label",""); l.appendChild(el("span","","search"));
  const i=document.createElement("input"); i.type="search";
  i.placeholder="id, name, definition…";
  i.oninput=()=>{ catSearch=i.value.toLowerCase(); renderCat(); };
  l.appendChild(i); catTB.appendChild(l);
}
let catSelected=null;
function catEntries(){
  return CATALOGUE
    .filter(e=>!catSeries || e.series===catSeries)
    .map(e=>({series:e.series, kind:e.kind, entry:e}));
}
function renderCat(){
  const qy=catSearch;
  const rows=catEntries().filter(r=>{
    if(!qy) return true;
    const e=r.entry;
    return (e.id+" "+e.name+" "+e.detail+" "+e.extra).toLowerCase().includes(qy);
  });
  const tbl=DataTable($("#catTable"),{
    id: "tCat",
    columns: [
      {k:"id",label:"ID",cls:"id",w:"7%"},{k:"name",label:"Name",w:"16%"},
      {k:"kind",label:"Kind",cls:"id",w:"11%"},{k:"detail",label:"Definition",w:"26%"},
      {k:"extra",label:"Also",w:"20%"},{k:"evidence",label:"Evidence",w:"20%"}],
    rows: rows.map(r=>[esc(r.entry.id),
      '<b>'+esc(plain(r.entry.name))+"</b>",
      esc(r.kind),
      cell(r.entry.detail||""),
      cell(r.entry.extra||""),
      citationCell(r.entry.evidence)])});
  /* Clicking a row shows the entry's own detail, including the parts the
     document gives it. */
  tbl.querySelectorAll("tbody tr").forEach((tr,i)=>{
    tr.style.cursor="pointer";
    tr.onclick=(ev)=>{
      if(ev.target.closest("a.idlink")) return;
      catSelected=rows[i].entry.id;
      showCatDetail(catSelected);
      tbl.querySelectorAll("tbody tr").forEach(x=>x.classList.remove("rowsel"));
      tr.classList.add("rowsel");
    };
  });
  if(catSelected) showCatDetail(catSelected);
  else showCatDetail(null);
}
/* The catalogue quotes the document. An EXPRESSION, though, is shown the
   way the page shows expressions everywhere else - read, with the source
   in the hint - so the reader is not asked to learn two rules. A marker
   is not read at all: the export says so. */
function docText(text,notExpressible){
  const s=String(text||"").trim();
  if(!s) return "";
  const BT=String.fromCharCode(96);
  if(!notExpressible && s.startsWith(BT) && s.endsWith(BT)){
    const words=decypher(s);
    if(words) return '<span class="written" title="'+esc(s)+'">'+words+"</span>";
  }
  return cell(s);
}
/* The guard an identifier carries, where the flat catalogue record has no
   room for it: the precondition of a command, the condition of a policy,
   the predicate a finding's reachability claim was tested against. */
function guardOf(id){
  const cmd=COMMANDS.find(c=>c.id===id);
  if(cmd) return {label:"Preconditions", text:cmd.guards};
  const pol=POLICIES.find(p=>p.id===id);
  if(pol) return {label:"Condition", text:pol.condition};
  const pr=PROBES.find(p=>p.id===id);
  if(pr) return {label:"Reachability probe", text:pr.predicate};
  return null;
}
function showCatDetail(id){
  const host=$("#catDetail");
  if(!id){ host.innerHTML='<p class="muted">Pick an entry to read what the document says about it.</p>'; return; }
  const entry=null;
  let found=null, series=null;
  CATALOGUE.forEach(e=>{ if(e.id===id){ found=e; series={series:e.series, kind:e.kind}; } });
  if(!found){ host.innerHTML='<p class="muted">Nothing is indexed under '+esc(id)+'.</p>'; return; }
  /* An invariant's marker is the export's to say, not the page's to read. */
  const invRec = byId(INVARIANTS, found.id);
  const d=IDX[id]||{};
  let extra="";
  /* The guard the flat record dropped: what the document requires before
     this thing may happen. */
  const g=guardOf(id);
  if(g){
    extra='<h3 style="margin-top:11px">The guard</h3><dl>'+
      "<dt>"+esc(g.label)+"</dt><dd class='prose'>"+(docText(g.text)||"—")+"</dd></dl>"+extra;
  }
  const agg=CAT_AGG.find(a=>a.id===id);
  if(agg){
    extra='<h3 style="margin-top:11px">Aspects</h3><dl>'+
      agg.aspects.map(a=>"<dt>"+esc(a.aspect)+"</dt><dd>"+cell(a.content)+
        (a.evidence?'<div class="muted small">'+citationCell(a.evidence)+"</div>":"")+"</dd>").join("")+"</dl>";
  }
  const scn=CAT_SCN.find(s=>s.id===id);
  if(scn){
    extra='<h3 style="margin-top:11px">The scenario</h3><dl>'+
      scn.parts.map(p=>"<dt>"+esc(p.label)+"</dt><dd>"+cell(p.text)+"</dd>").join("")+"</dl>";
  }
  const n=CAT_N.find(x=>x.id===id);
  if(n){
    extra='<h3 style="margin-top:11px">Rewritten around the role</h3><dl>'+
      "<dt>As written</dt><dd>"+cell(n.name)+"</dd>"+
      "<dt>Rewritten</dt><dd>"+cell(n.rewritten)+"</dd></dl>";
  }
  host.innerHTML=
    "<h3>"+esc(found.id)+" — "+esc(plain(found.name))+"</h3>"+
    "<dl>"+
    "<dt>Kind</dt><dd>"+esc(series.kind)+"</dd>"+
    "<dt>Definition</dt><dd class='prose'>"+docText(found.detail||"", invRec&&invRec.notExpressible)+"</dd>"+
    (found.extra?"<dt>Also</dt><dd class='prose'>"+cell(found.extra)+"</dd>":"")+
    "<dt>Evidence</dt><dd>"+citationCell(found.evidence)+"</dd>"+
    "</dl>"+extra;
}

/* ------------------------------------------------------------- rendering */
function render(){
  renderTrans(); renderInv(); renderReach(); renderCoup(); renderFind(); renderOpen();
  renderGlossary(); renderCat();
}
drawMachine();
render();

/* ==================================================== going to an id
 *
 * A link carries the id it names. Clicking it takes the reader to the
 * place that id lives, with the row or the node selected — the link is
 * a way in, not just a decoration. */
function highlightRow(tableId,id){
  const tbl=document.getElementById(tableId);
  if(!tbl) return false;
  let hit=null;
  tbl.querySelectorAll("tbody tr").forEach(tr=>{
    const t=tr.cells[0]?tr.cells[0].textContent.trim():"";
    tr.classList.remove("rowsel");
    if(t===id){ hit=tr; }
  });
  if(!hit) return false;
  hit.classList.add("rowsel");
  hit.scrollIntoView({block:"center"});
  return true;
}
function gotoId(id){
  const d=IDX[id];
  if(!d) return;
  showTab(d.tab);
  if(d.tab==="catalogue"){
    catSeries=""; catSearch="";
    catTB.querySelectorAll("input[name=catk]").forEach(i=>{ i.checked=(i.value===""); });
    const sb=catTB.querySelector("input[type=search]"); if(sb) sb.value="";
    renderCat();
    const tbl=document.getElementById("tCat");
    if(tbl) tbl.querySelectorAll("tbody tr").forEach(tr=>{
      const t=tr.cells[0]?tr.cells[0].textContent.trim():"";
      tr.classList.remove("rowsel");
      if(t===id){
        tr.classList.add("rowsel");
        tr.scrollIntoView({block:"center"});
        catSelected=id; showCatDetail(id);
      }
    });
    return;
  }
  if(d.tab==="glossary"){ renderGlossary(); highlightRow("tGlos",id); return; }
  if(d.tab==="invariants"){
    if(invKind!=="all"){ invKind="all";
      invTB.querySelectorAll("input[name=invk]").forEach(i=>{ i.checked=(i.value==="all"); }); }
    renderInv(); highlightRow("tInv",id); return;
  }
  if(d.tab==="findings"){
    if(findKind!=="all"){ findKind="all";
      findTB.querySelectorAll("input[name=fk]").forEach(i=>{ i.checked=(i.value==="all"); }); }
    if(findProbe!=="all"){ findProbe="all";
      findTB.querySelectorAll("input[name=fp]").forEach(i=>{ i.checked=(i.value==="all"); }); }
    renderFind(); highlightRow("tFind",id); return;
  }
  if(d.tab==="open"){ renderOpen(); highlightRow("tOpen",id); return; }
  if(d.tab==="machines"){
    const st=stateById(id);
    if(st){
      curMachine=st.machine; selState=id; selTransition=null;
      syncMachineChips(st.machine); drawMachine(); showState(id); return;
    }
    const tr=byId(TRANSITIONS,id);
    if(tr){
      curMachine=tr.machine; selTransition=id; selState=null;
      syncMachineChips(tr.machine); drawMachine(); showTransition(id); return;
    }
    const m=machineById(id);
    if(m){ setMachine(id); }
  }
}
document.addEventListener("click", ev=>{
  const a=ev.target.closest && ev.target.closest("a.idlink");
  if(!a) return;
  ev.preventDefault();
  /* A chip that names a PARAGRAPH leads to the paragraph - in the
     specification, wherever the chip itself sits. */
  const spec=a.getAttribute("data-spec");
  if(spec){ gotoSpec(spec); return; }
  gotoId(a.getAttribute("data-id"));
});

/* A machine change redraws the diagram only. */
const machOrig = machTB.onchange;
window.addEventListener("resize",()=>{ drawMachine(); });
</script>
